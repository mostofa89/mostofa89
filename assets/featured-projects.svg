<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Four featured projects connected like a neural network">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050a14"/><stop offset="0.5" stop-color="#0b1b33"/><stop offset="1" stop-color="#150f33"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<filter id="b" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="150" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="148" rx="13" fill="none" stroke="url(#ln)" stroke-opacity="0.45" stroke-width="1.2"/>
<line x1="150" y1="62" x2="450" y2="48" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
<line x1="150" y1="62" x2="450" y2="48" stroke="url(#ln)" stroke-width="2" stroke-dasharray="5 11"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/></line>
<circle r="3" fill="#fff"><animateMotion path="M150 62 L450 48" dur="3s" repeatCount="indefinite"/></circle>
<line x1="450" y1="48" x2="750" y2="72" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
<line x1="450" y1="48" x2="750" y2="72" stroke="url(#ln)" stroke-width="2" stroke-dasharray="5 11"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/></line>
<circle r="3" fill="#fff"><animateMotion path="M450 48 L750 72" dur="3s" repeatCount="indefinite"/></circle>
