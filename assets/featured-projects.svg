<circle r="3" fill="#fff"><animateMotion path="M750 72 L1050 52" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="62" r="16" fill="#38bdf8" opacity="0.35" filter="url(#b)"/>
<circle cx="150" cy="62" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"><animate attributeName="r" values="8;28" dur="3s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="62" r="8" fill="#38bdf8"/><circle cx="150" cy="62" r="3" fill="#fff"/>
<text x="150" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Cartify</text>
<text x="150" y="119" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#94a3b8">Django · React</text>
<circle cx="450" cy="48" r="16" fill="#a78bfa" opacity="0.35" filter="url(#b)"/>
<circle cx="450" cy="48" r="8" fill="none" stroke="#a78bfa" stroke-width="1.5"><animate attributeName="r" values="8;28" dur="3s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="48" r="8" fill="#a78bfa"/><circle cx="450" cy="48" r="3" fill="#fff"/>
<text x="450" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">NIDS Thesis</text>
<text x="450" y="105" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#94a3b8">AIS + RL</text>
<circle cx="750" cy="72" r="16" fill="#2dd4bf" opacity="0.35" filter="url(#b)"/>
<circle cx="750" cy="72" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.5"><animate attributeName="r" values="8;28" dur="3s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle cx="750" cy="72" r="8" fill="#2dd4bf"/><circle cx="750" cy="72" r="3" fill="#fff"/>
