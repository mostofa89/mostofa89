<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Animated project command center connecting commerce, security, data science, and sports analytics projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03060f"/><stop offset=".55" stop-color="#0a1830"/><stop offset="1" stop-color="#241a66"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="1184" height="234" rx="22" fill="url(#bg)" stroke="#38bdf8" stroke-opacity=".35"/>
  <path d="M70 181H1130M70 205H1130" stroke="#38bdf8" stroke-opacity=".08"/>
  <g stroke="url(#line)" fill="none" stroke-width="2">
    <path d="M170 108H350L490 150H710L850 108H1030" stroke-dasharray="5 10"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#fff" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" path="M170 108H350L490 150H710L850 108H1030"/></circle>
    <circle r="4"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M170 108H350L490 150H710L850 108H1030"/></circle>
  </g>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <text x="600" y="43" fill="#38bdf8" font-size="12" letter-spacing="3">PROJECT COMMAND CENTER</text>
    <text x="600" y="65" fill="#94a3b8" font-size="11">four systems • one engineering mindset</text>
    <g fill="#38bdf8" font-size="11"><text x="170" y="213">01 / BUILD</text><text x="490" y="213">02 / DEFEND</text><text x="710" y="213">03 / PREDICT</text><text x="1030" y="213">04 / MODEL</text></g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#e6edf3">
    <g><circle cx="170" cy="108" r="26" fill="#0f3a6b" stroke="#38bdf8"/><circle cx="170" cy="108" r="9" fill="#38bdf8"/><circle cx="170" cy="108" r="15" fill="none" stroke="#38bdf8" opacity=".6"><animate attributeName="r" values="15;31" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.5s" repeatCount="indefinite"/></circle><text x="170" y="155" font-size="17" font-weight="700">CARTIFY</text><text x="170" y="173" fill="#94a3b8" font-size="11">DJANGO + REACT</text></g>
    <g><circle cx="490" cy="150" r="26" fill="#241a66" stroke="#818cf8"/><circle cx="490" cy="150" r="9" fill="#818cf8"/><circle cx="490" cy="150" r="15" fill="none" stroke="#818cf8" opacity=".6"><animate attributeName="r" values="15;31" dur="2.5s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.5s" begin=".6s" repeatCount="indefinite"/></circle><text x="490" y="107" font-size="17" font-weight="700">NIDS THESIS</text><text x="490" y="125" fill="#94a3b8" font-size="11">AIS + RL</text></g>
    <g><circle cx="710" cy="150" r="26" fill="#063b46" stroke="#2dd4bf"/><circle cx="710" cy="150" r="9" fill="#2dd4bf"/><circle cx="710" cy="150" r="15" fill="none" stroke="#2dd4bf" opacity=".6"><animate attributeName="r" values="15;31" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle><text x="710" y="107" font-size="17" font-weight="700">ROAD ACCIDENT ML</text><text x="710" y="125" fill="#94a3b8" font-size="11">SCIKIT-LEARN</text></g>
    <g><circle cx="1030" cy="108" r="26" fill="#0f3a6b" stroke="#38bdf8"/><circle cx="1030" cy="108" r="9" fill="#38bdf8"/><circle cx="1030" cy="108" r="15" fill="none" stroke="#38bdf8" opacity=".6"><animate attributeName="r" values="15;31" dur="2.5s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle><text x="1030" y="155" font-size="17" font-weight="700">T20 MODEL</text><text x="1030" y="173" fill="#94a3b8" font-size="11">REGRESSION</text></g>
  </g>
</svg>
