<circle cx="1050" cy="52" r="8" fill="none" stroke="#818cf8" stroke-width="1.5"><animate attributeName="r" values="8;28" dur="3s" begin="2.0999999999999996s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" begin="2.0999999999999996s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="52" r="8" fill="#818cf8"/><circle cx="1050" cy="52" r="3" fill="#fff"/>
<text x="1050" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">T20 Score Model</text>
<text x="1050" y="109" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#94a3b8">Regression</text>
